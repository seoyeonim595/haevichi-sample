<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/swiper.css">
</head>

<body>
    <main>
        <div class="main-slider-wrap">
            <div class="main-slider swiper mySwiper">
                <ul class="main-slider-list swiper-wrapper">
                    <li class="swiper-slide">
                        <div class="img-box"><img src="./Hero/hero1.png" alt=""></div>
                        <div class="text-box">
                            <span>Heavich Hotel & Resort Jeju</span>
                            <strong>자연과 함께하는<br>
                                완벽한 휴식</strong>
                            <p class="main-slider-more btn"><a href="#">about Haevichi</a></p>
                        </div>
                    </li>
                    <li class="swiper-slide">
                        <div class="img-box"><img src="./Hero/hero2.png" alt=""></div>
                        <div class="text-box">
                            <span>Heavich Hotel & Resort Jeju</span>
                            <strong>자연과 함께하는<br>
                                완벽한 휴식</strong>
                            <p class="main-slider-more btn"><a href="#">about Haevichi</a></p>
                        </div>
                    </li>
                    <li class="swiper-slide">
                        <div class="img-box"><img src="./Hero/hero3.png" alt=""></div>
                        <div class="text-box">
                            <span>Heavich Hotel & Resort Jeju</span>
                            <strong>자연과 함께하는<br>
                                완벽한 휴식</strong>
                            <p class="main-slider-more btn"><a href="#">about Haevichi</a></p>
                        </div>
                    </li>
                    <li class="swiper-slide">
                        <div class="img-box"><img src="./Hero/hero4.png" alt=""></div>
                        <div class="text-box">
                            <span>Heavich Hotel & Resort Jeju</span>
                            <strong>자연과 함께하는<br>
                                완벽한 휴식</strong>
                            <p class="main-slider-more btn"><a href="#">about Haevichi</a></p>
                        </div>
                    </li>
                </ul>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>
    </main>


    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper('.mySwiper', {
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
</body>

</html>
